name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show the error
        if: failure()
        shell: bash
        run: |
          MSG=$(grep -E -A8 "What went wrong|^e: |error:" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build error::$MSG"
          grep -E -A8 "What went wrong|^e: |error:" build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: CodePress-debug-apk
          path: app/build/outputs/apk/debug/*.apk
